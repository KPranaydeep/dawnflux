name: Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml', 'src/**', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p android testDebugUnitTest lintDebug assembleDebug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_android_contract.py
        env:
          ANDROID_CONTRACT_DIR: android/app/build/contract-fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: dawnflux-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
